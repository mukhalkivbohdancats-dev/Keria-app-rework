name: Build APK from 2 files

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Android structure and build configs
        run: |
          # Нормалізація коду через Python: заміна RectangleShape на RoundedCornerShape(0.dp)
          python3 - <<'PY'
          from pathlib import Path

          path = Path("MainActivity.kt")
          if path.exists():
              source = path.read_text(encoding="utf-8", errors="ignore")

              # Видаляємо всі існуючі імпорти RectangleShape
              source = "\n".join(
                  line for line in source.splitlines()
                  if not (line.strip().startswith("import ") and "RectangleShape" in line)
              )

              # Замінюємо використання RectangleShape на RoundedCornerShape(0.dp)
              source = source.replace("RectangleShape", "RoundedCornerShape(0.dp)")

              lines = source.splitlines()

              # Додаємо необхідні імпорти після оголошення package
              for index, line in enumerate(lines):
                  if line.strip().startswith("package "):
                      imports = [
                          "import androidx.compose.foundation.shape.RoundedCornerShape",
                          "import androidx.compose.ui.unit.dp",
                      ]

                      for offset, import_line in enumerate(imports, start=1):
                          if import_line not in lines:
                              lines.insert(index + offset, import_line)
                      break

              path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          # Визначаємо пакет із MainActivity.kt
          PKG=$(grep -oP 'package \K[^\s]+' MainActivity.kt || echo "com.example.keriaapp")
          PKG_PATH=$(echo "$PKG" | tr '.' '/')

          # Створюємо необхідні папки проєкту
          mkdir -p "app/src/main/java/$PKG_PATH"
          mkdir -p app/src/main/res/raw
          mkdir -p app/src/main/res/drawable

          # Переміщуємо MainActivity.kt, аудіо та фонові ресурси
          cp MainActivity.kt "app/src/main/java/$PKG_PATH/"
          [ -f meow.mp3 ] && cp meow.mp3 app/src/main/res/raw/
          [ -f bg_image.png ] && cp bg_image.png app/src/main/res/drawable/
          [ -f bg_image.jpg ] && cp bg_image.jpg app/src/main/res/drawable/bg_image.png

          # Генеруємо gradle.properties
          cat <<EOF > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # Генеруємо AndroidManifest.xml
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="$PKG">
              <application
                  android:label="keria-app"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Генеруємо app/build.gradle
          cat <<EOF > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace '$PKG'
              compileSdk 34

              defaultConfig {
                  applicationId "$PKG"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildFeatures {
                  compose true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion '1.5.10'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'

              implementation platform('androidx.compose:compose-bom:2024.02.02')
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation 'androidx.compose.foundation:foundation'
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.ui:ui-graphics'
              implementation 'androidx.compose.ui:ui-tooling-preview'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.compose.material:material'

              debugImplementation 'androidx.compose.ui:ui-tooling'
          }
          EOF

          # Генеруємо кореневий build.gradle
          cat <<EOF > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          EOF

          # Генеруємо settings.gradle
          cat <<EOF > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "keria-app"
          include ':app'
          EOF

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keria-app
          path: app/build/outputs/apk/debug/app-debug.apk
